services:
  downloader:
    image: ${TTDOWNLOADER_IMAGE:-ttdownloader:local}
    build: .
    environment:
      APP_PASSWORD_FILE: /run/secrets/app_password
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    secrets:
      - app_password
    ports:
      - "127.0.0.1:8000:8000"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0700,size=2g
      - /tmp:size=256m
    mem_limit: 3g
    cpus: 2
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
secrets:
  app_password:
    file: ./.secrets/app_password
