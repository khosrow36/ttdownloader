server {
    listen 80;
    server_name ttdownloader.kodpolex.xyz;
    return 301 https://ttdownloader.kodpolex.xyz$request_uri;
}

server {
    listen 443 ssl;
    server_name ttdownloader.kodpolex.xyz;

    ssl_certificate /etc/letsencrypt/live/ttdownloader.kodpolex.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ttdownloader.kodpolex.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
        send_timeout 310s;
        proxy_buffering off;
    }
}
